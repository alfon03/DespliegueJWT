<nav
  class="bg-gradient-to-r from-blue-600 to-blue-700 p-4 text-white flex justify-between items-center shadow-lg"
>
  <div class="flex items-center space-x-3">
    <span class="material-symbols-outlined text-3xl">contacts</span>
    <h1 class="text-xl font-bold">Gestión de Contactos</h1>
  </div>

  <div class="flex items-center space-x-6">
    <ng-container *ngIf="!authService.isLogged(); else loggedIn">
      <a
        routerLink="/register"
        class="relative flex items-center space-x-2 px-4 py-2 rounded-lg transition hover:bg-blue-800 focus:outline-none group"
        routerLinkActive="bg-blue-800 font-bold"
        aria-label="Registrarse"
      >
        <span class="material-symbols-outlined text-lg">person_add</span>
        <span>Registrarse</span>

        <span
          class="absolute top-full left-1/2 transform -translate-x-1/2 mt-2 px-3 py-1 text-xs bg-black text-white rounded opacity-0 group-hover:opacity-100 transition-opacity duration-300"
        >
          Crear una cuenta
        </span>
      </a>

      <a
        routerLink="/login"
        class="relative flex items-center space-x-2 px-4 py-2 rounded-lg transition hover:bg-blue-800 focus:outline-none group"
        routerLinkActive="bg-blue-800 font-bold"
        aria-label="Iniciar sesión"
      >
        <span class="material-symbols-outlined text-lg">login</span>
        <span>Iniciar sesión</span>

        <span
          class="absolute top-full left-1/2 transform -translate-x-1/2 mt-2 px-3 py-1 text-xs bg-black text-white rounded opacity-0 group-hover:opacity-100 transition-opacity duration-300"
        >
          Acceder a tu cuenta
        </span>
      </a>
    </ng-container>

    <ng-template #loggedIn>
      <a
        routerLink="/contacts"
        class="relative flex items-center space-x-2 px-4 py-2 rounded-lg transition hover:bg-blue-800 focus:outline-none group"
        routerLinkActive="bg-blue-800 font-bold"
        aria-label="Contactos"
      >
        <span class="material-symbols-outlined text-lg">contacts</span>
        <span>Contactos</span>

        <span
          class="absolute top-full left-1/2 transform -translate-x-1/2 mt-2 px-3 py-1 text-xs bg-black text-white rounded opacity-0 group-hover:opacity-100 transition-opacity duration-300"
        >
          Ver lista de contactos
        </span>
      </a>

      <button
        (click)="logOut()"
        class="relative flex items-center space-x-2 px-4 py-2 rounded-lg transition hover:bg-red-700 focus:outline-none group"
        aria-label="Cerrar sesión"
      >
        <span class="material-symbols-outlined text-lg">logout</span>
        <span>Log out</span>

        <span
          class="absolute top-full left-1/2 transform -translate-x-1/2 mt-2 px-3 py-1 text-xs bg-black text-white rounded opacity-0 group-hover:opacity-100 transition-opacity duration-300"
        >
          Salir de la cuenta
        </span>
      </button>
    </ng-template>
  </div>
</nav>

<router-outlet></router-outlet>
