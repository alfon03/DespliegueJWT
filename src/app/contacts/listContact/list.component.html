<div class="max-w-2xl mx-auto mt-10 bg-white p-6 rounded-lg shadow-lg">
  <h2
    class="text-2xl font-bold mb-6 text-center text-gray-800 flex items-center justify-center space-x-2"
  >
    <span class="material-symbols-outlined text-blue-600">contacts</span>
    <span>Mis Contactos</span>
  </h2>

  <ul>
    <ng-container
      *ngIf="
        contactsService.contacts() && contactsService.contacts().length > 0;
        else noContacts
      "
    >
      <li
        *ngFor="let contact of contactsService.contacts()"
        class="border-b last:border-none py-3"
      >
        <div class="flex justify-between items-center">
          <div class="text-gray-700">
            <span class="font-medium">{{ contact.nombre }}</span> -
            <span class="text-gray-500">{{ contact.email }}</span>
          </div>
          <div class="space-x-3 flex">
            <button
              (click)="editContact(contact.id)"
              class="bg-yellow-500 text-white px-3 py-2 rounded-lg hover:bg-yellow-600 transition flex items-center space-x-1 relative"
              title="Editar contacto"
            >
              <span class="material-symbols-outlined">edit</span>
            </button>

            <button
              (click)="removeContact(contact.id)"
              class="bg-red-600 text-white px-3 py-2 rounded-lg hover:bg-red-700 transition flex items-center space-x-1 relative"
              title="Eliminar contacto"
            >
              <span class="material-symbols-outlined">delete</span>
            </button>
          </div>
        </div>
      </li>
    </ng-container>

    <ng-template #noContacts>
      <h3 class="text-gray-500 text-center mt-4">
        No tienes contactos todavía.
      </h3>
    </ng-template>
  </ul>
</div>

<app-add></app-add>
