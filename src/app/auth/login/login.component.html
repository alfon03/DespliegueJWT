<!-- Formulario de Inicio de Sesión -->
<div class="max-w-md mx-auto mt-10 bg-white p-8 rounded-lg shadow-lg">
  <h2 class="text-2xl font-semibold text-center text-gray-800 mb-6">
    Iniciar Sesión
  </h2>

  <form [formGroup]="loginForm" (ngSubmit)="submit()" class="space-y-6">
    <div class="relative">
      <label class="block text-gray-700 font-medium mb-1" for="email">
        Correo Electrónico
      </label>
      <div class="relative">
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="ejemplo@correo.com"
          class="w-full border border-gray-300 rounded-lg p-3 pr-10 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-300 hover:border-blue-500"
        />
        <span
          class="absolute top-1/2 right-3 transform -translate-y-1/2 text-gray-500 hover:text-blue-600"
        >
          <span class="material-symbols-outlined">email</span>
        </span>
      </div>
      <div *ngIf="campoNoValido('email')" class="mt-2 text-sm text-red-600">
        Debe proporcionar un email válido.
      </div>
    </div>

    <div class="relative">
      <label class="block text-gray-700 font-medium mb-1" for="password">
        Contraseña
      </label>
      <div class="relative">
        <input
          id="password"
          [type]="passwordVisible ? 'text' : 'password'"
          formControlName="password"
          placeholder="••••••••"
          class="w-full border border-gray-300 rounded-lg p-3 pr-10 text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-300 hover:border-blue-500"
        />
        <span
          class="absolute top-1/2 right-3 transform -translate-y-1/2 text-gray-500 hover:text-blue-600 cursor-pointer"
          (click)="togglePasswordVisibility()"
          data-tooltip="Mostrar/ocultar contraseña"
        >
          <span class="material-symbols-outlined">
            {{ passwordVisible ? "visibility_off" : "visibility" }}
          </span>
        </span>
      </div>
      <div *ngIf="campoNoValido('password')" class="mt-2 text-sm text-red-600">
        La contraseña debe tener al menos 6 caracteres, incluir una letra y un
        número.
      </div>
    </div>

    <button
      type="submit"
      class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium p-3 rounded-lg transition duration-300 disabled:opacity-50 disabled:cursor-not-allowed"
      [disabled]="loginForm.invalid"
    >
      Iniciar sesión
    </button>
  </form>
</div>
